<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:10px;
  background:#f9f9f9;
  display:flex;
  justify-content:center;
}

.box{
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  width:100%;
  max-width:350px;
  margin:auto;
  box-sizing:border-box;
  background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  text-align:center;
}

.city{
  font-weight:bold;
  font-size:16px;
  margin-bottom:5px;
}

.date-hijri{
  font-size:14px;
  margin-bottom:3px;
  color:#555;
}

.date-greg{
  font-size:14px;
  margin-bottom:3px;
  color:#fff;
  background-color:#000;
  padding:10px 0;
  border-radius:4px;
}

#solat{
  margin-top:10px;
  text-align:left; /* prayer times left-aligned */
}

.row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px dashed #eee;
}

.row:last-child{
  border-bottom:none;
}

.prayer-title{
  font-weight:500;
}

.prayer-time{
  font-weight:bold;
}

.footer{
  margin-top:12px;
  font-size:12px;
  color:#888;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">
  <div class="city">Kuala Lumpur, Malaysia</div>
  <div class="date-hijri" id="hijri-date">Loading Hijri...</div>
  <div class="date-greg" id="greg-date">Loading Gregorian...</div>

  <div id="solat">Loading prayer times...</div>
  
  <div class="footer">Powered by <a href="https://www.e-solat.gov.my/" target="_blank">www.e-solat.gov.my</a></div>
</div>

<script>
const hijriMonths = ["Muharram","Safar","Rabi'ul Awal","Rabi'ul Akhir","Jumadaul Ula","Jumadaul Akhira","Rejab","Sya'ban","Ramadan","Syawal","Zulkaedah","Zulhijjah"];

// Function to convert 24-hour time to 12-hour AM/PM format
function formatTime24to12(time24){
  const [h,m] = time24.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM";
  const hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} ${ampm}`;
}

fetch("https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&zone=WLY01&period=today")
.then(res => res.json())
.then(data => {
  const t = data.prayerTime[0];

  // Hijri formatting
  const [hYear,hMonth,hDay] = t.hijri.split("-");
  document.getElementById("hijri-date").innerText = `${parseInt(hDay)}th ${hijriMonths[parseInt(hMonth)-1]}, ${hYear}h`;

  // Gregorian formatting
  const gregDate = new Date(t.date);
  const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
  document.getElementById("greg-date").innerText = gregDate.toLocaleDateString('en-US', options);

  // Prayer times with AM/PM
  document.getElementById("solat").innerHTML = `
    <div class="row"><span class="prayer-title">Subuh</span><span class="prayer-time">${formatTime24to12(t.fajr)}</span></div>
    <div class="row"><span class="prayer-title">Dhuha</span><span class="prayer-time">${formatTime24to12(t.dhuha)}</span></div>
    <div class="row"><span class="prayer-title">Zohor</span><span class="prayer-time">${formatTime24to12(t.dhuhr)}</span></div>
    <div class="row"><span class="prayer-title">Asar</span><span class="prayer-time">${formatTime24to12(t.asr)}</span></div>
    <div class="row"><span class="prayer-title">Maghrib</span><span class="prayer-time">${formatTime24to12(t.maghrib)}</span></div>
    <div class="row"><span class="prayer-title">Isyak</span><span class="prayer-time">${formatTime24to12(t.isha)}</span></div>
  `;
});
</script>

</body>
</html>
